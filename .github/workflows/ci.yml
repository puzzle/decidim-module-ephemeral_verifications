name: "[CI] Tests (Decidim 0.31)"

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  RUBY_VERSION: 3.3.4
  # Decidim 0.31's package.json declares "node": ">=22.14.0".
  NODE_VERSION: 22.14.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: bundle exec rubocop --parallel

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # Overrides spec/database_defaults.rb, which points at the port used by this
    # repository's docker-compose.yml.
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create the test app
        run: bundle exec rake test_app

      - name: Compile assets
        run: RAILS_ENV=test bundle exec rails shakapacker:compile
        working-directory: ./spec/decidim_dummy_app

      # System specs drive a real browser.
      - uses: nanasess/setup-chromedriver@v2
      - run: mkdir -p ./spec/decidim_dummy_app/tmp/screenshots

      - name: Run the specs
        run: bundle exec rspec

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ./spec/decidim_dummy_app/tmp/screenshots
          if-no-files-found: ignore
